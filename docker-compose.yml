services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Backend API this app calls (app/lib/apiClient.ts). It runs outside this
      # container, so "localhost" here would mean the container itself, not
      # your host machine. host.docker.internal resolves to the host and is
      # made to work on Linux via extra_hosts below.
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:4000/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
